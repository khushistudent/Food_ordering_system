{% extends 'base.html' %}
{% load static %}
{% block abc %}
  <div class="row card11 my-5 mb-5">
                <div class="col-12">
                <b class="badge bg-success">{{msg}}</b>
                    <form  method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                <div class="mb-3 input-box mt-4">
                  <h2 class="h  fw-bold text-center">Login form<i class="fa-solid fa-key fa-spin"></i></h2>
                <label for="email" class="form-label">Userid:<b class="h">*</b></label>
                <input type="email" class="form-control" id="email" name="email" required>
                </div>

                 <div class="mb-3 input-box">
                <label for="pass" class="form-label">Password:<b class="h">*</b></label>
                <input type="password" class="form-control" id="pass" name="pass" autocomplete="new-password" required>
                </div>
                 <a href="{% url 'Register' %}" style="text-decoration: none ; color: black;"> <b>Not registerd ? Register Now..</b></a>
                 <div class="mb-3 input-box d-flex justify-content-center">
                  <button class="btn btn-danger" type="submit">Log in</button>

                </div>
                </form>
            </div>
       </div>
{% endblock %}
